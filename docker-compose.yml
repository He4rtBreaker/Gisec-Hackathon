services:
  # Presidio's NER-backed PII analyzer, used by src/lib/classify/presidio.ts as
  # an additional signal source alongside the regex detectors in detectors.ts.
  #
  # Bound to loopback only — same network-boundary posture as every other
  # on-prem binding in this project (see egressAllowed() in src/lib/llm/provider.ts).
  # It never needs to leave the host: the model files ship inside the image,
  # so once pulled this runs fully air-gapped.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "127.0.0.1:5002:3000"
    restart: unless-stopped

  # Presidio's anonymizer, used by src/lib/classify/anonymize.ts to replace the
  # spans the analyzer found with reversible placeholders before a request is
  # allowed out to a public model.
  #
  # Loopback only, same as the analyzer: the mapping between a placeholder and
  # the real value it stands for must never be reachable from outside the host.
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "127.0.0.1:5003:3000"
    restart: unless-stopped
